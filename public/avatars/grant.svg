<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="gr-skin" cx="46%" cy="35%" r="63%">
      <stop offset="0%" stop-color="#a87850"/>
      <stop offset="65%" stop-color="#8a5830"/>
      <stop offset="100%" stop-color="#6a3e1a"/>
    </radialGradient>
    <radialGradient id="gr-hair" cx="50%" cy="22%" r="68%">
      <stop offset="0%" stop-color="#160e08"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </radialGradient>
    <linearGradient id="gr-blazer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a7810"/>
      <stop offset="100%" stop-color="#2e5008"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#65a30d"/>

  <!-- Blazer / smart casual -->
  <path d="M0,100 Q18,76 40,70 L50,75 L60,70 Q82,76 100,100Z" fill="url(#gr-blazer)"/>
  <!-- Lapels -->
  <path d="M40,70 L45,64 L50,70" fill="#3a6008" stroke="#2e5008" stroke-width="0.5"/>
  <path d="M60,70 L55,64 L50,70" fill="#3a6008" stroke="#2e5008" stroke-width="0.5"/>
  <!-- Shirt collar -->
  <path d="M47,68 L50,64 L53,68" fill="#f0f4e8" stroke="#d0d8c0" stroke-width="0.4"/>

  <!-- Neck -->
  <path d="M43,67 Q50,70 57,67 L57,74 Q50,76 43,74Z" fill="#7a5028"/>

  <!-- Ears -->
  <ellipse cx="30" cy="45" rx="4" ry="5" fill="#7a5028"/>
  <ellipse cx="70" cy="45" rx="4" ry="5" fill="#7a5028"/>

  <!-- Head -->
  <ellipse cx="50" cy="44" rx="21" ry="23" fill="url(#gr-skin)"/>

  <!-- Hair — short natural texture, tight coil pattern on top -->
  <!-- Base dome shape -->
  <path d="M30,47 Q28,16 50,13 Q72,16 70,47 Q67,28 50,21 Q33,28 30,47Z"
        fill="url(#gr-hair)"/>
  <!-- Natural texture — short, close-cropped with some shape on top -->
  <path d="M34,28 Q38,22 44,20 Q50,18 56,20 Q62,22 66,28"
        stroke="#1e1208" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M35,32 Q42,27 50,26 Q58,27 65,32"
        stroke="#1e1208" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- Crown texture dots — coil suggestion -->
  <circle cx="44" cy="21" r="1" fill="#1e1208" opacity="0.35"/>
  <circle cx="50" cy="19" r="1" fill="#1e1208" opacity="0.35"/>
  <circle cx="56" cy="21" r="1" fill="#1e1208" opacity="0.35"/>
  <circle cx="41" cy="25" r="1" fill="#1e1208" opacity="0.3"/>
  <circle cx="59" cy="25" r="1" fill="#1e1208" opacity="0.3"/>

  <!-- Eyebrows — steady, flat, quietly confident -->
  <path d="M33,35.5 Q38.5,33.5 44,35" stroke="#0a0608" stroke-width="2.3" fill="none" stroke-linecap="round"/>
  <path d="M56,35 Q61.5,33.5 67,35.5" stroke="#0a0608" stroke-width="2.3" fill="none" stroke-linecap="round"/>

  <!-- Eyes — steady, matter-of-fact gaze -->
  <ellipse cx="39" cy="41" rx="5.8" ry="4" fill="white"/>
  <ellipse cx="61" cy="41" rx="5.8" ry="4" fill="white"/>
  <!-- Upper eyelid -->
  <path d="M33.2,39 Q39,36.8 44.8,39" stroke="#0a0608" stroke-width="1.3" fill="none"/>
  <path d="M55.2,39 Q61,36.8 66.8,39" stroke="#0a0608" stroke-width="1.3" fill="none"/>
  <!-- Iris — dark brown, unhurried -->
  <circle cx="39" cy="41" r="3" fill="#1a0c08"/>
  <circle cx="61" cy="41" r="3" fill="#1a0c08"/>
  <!-- Pupil -->
  <circle cx="39" cy="41" r="1.6" fill="#080404"/>
  <circle cx="61" cy="41" r="1.6" fill="#080404"/>
  <!-- Highlights -->
  <circle cx="40.2" cy="39.8" r="1" fill="white" opacity="0.9"/>
  <circle cx="62.2" cy="39.8" r="1" fill="white" opacity="0.9"/>
  <circle cx="37.8" cy="42.2" r="0.5" fill="white" opacity="0.4"/>
  <circle cx="59.8" cy="42.2" r="0.5" fill="white" opacity="0.4"/>

  <!-- Nose — strong, broad bridge -->
  <path d="M48,50 L47,54.5" stroke="#704020" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M52,50 L53,54.5" stroke="#704020" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M45.5,54.5 Q50,57 54.5,54.5" stroke="#704020" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Mouth — relaxed, contained — doesn't over-explain -->
  <path d="M43,59.5 Q46.5,61.5 50,61 Q53.5,61.5 57,59.5" stroke="#4a2010" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Subtle cheek warmth -->
  <ellipse cx="33" cy="49" rx="5" ry="3" fill="#8a5030" opacity="0.15"/>
  <ellipse cx="67" cy="49" rx="5" ry="3" fill="#8a5030" opacity="0.15"/>
</svg>
