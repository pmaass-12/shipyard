<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#64748b"/>

  <!-- Neck -->
  <rect x="43" y="70" width="14" height="8" fill="#d4956a"/>

  <!-- Clothing: blazer -->
  <path d="M 28 78 L 28 95 L 72 95 L 72 78 Q 62 72 50 72 Q 38 72 28 78 Z" fill="#334155"/>

  <!-- Face oval with gradient -->
  <defs>
    <linearGradient id="morgan-skin" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#e8b08a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4956a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b87850;stop-opacity:1" />
    </linearGradient>
  </defs>
  <ellipse cx="50" cy="53" rx="21" ry="26" fill="url(#morgan-skin)"/>

  <!-- Ears (hidden by hair/pulled back) -->
  <ellipse cx="27" cy="48" rx="3" ry="6" fill="#d4956a" opacity="0.6"/>
  <ellipse cx="73" cy="48" rx="3" ry="6" fill="#d4956a" opacity="0.6"/>

  <!-- Hair: pulled-back bun (dark, sleek) -->
  <path d="M 30 40 Q 28 30 35 20 Q 42 12 50 10 Q 58 12 65 20 Q 72 30 70 40 Q 68 45 65 48 Q 50 50 35 48 Q 32 45 30 40 Z" fill="#2a1a0a"/>
  <!-- Hair shine/mid-tone -->
  <path d="M 40 20 Q 45 15 50 14 Q 55 15 60 20 Q 58 28 55 35 Q 50 36 45 35 Q 42 28 40 20 Z" fill="#3d2a12"/>
  <!-- Bun at back top -->
  <ellipse cx="50" cy="8" rx="8" ry="6" fill="#2a1a0a"/>
  <path d="M 45 8 Q 45 5 50 3 Q 55 5 55 8 Q 50 10 45 8 Z" fill="#3d2a12"/>

  <!-- Eyebrows -->
  <path d="M 38 46 Q 42 44 46 46" stroke="#2a1a0a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 54 46 Q 58 44 62 46" stroke="#2a1a0a" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <g>
    <!-- Left eye -->
    <ellipse cx="41" cy="51" rx="3.5" ry="4" fill="#fff"/>
    <circle cx="41" cy="51" r="2" fill="#3a2010"/>
    <circle cx="41" cy="50.5" r="0.8" fill="#1a1a1a"/>
    <circle cx="42" cy="50" r="0.5" fill="#fff"/>
    <!-- Right eye -->
    <ellipse cx="59" cy="51" rx="3.5" ry="4" fill="#fff"/>
    <circle cx="59" cy="51" r="2" fill="#3a2010"/>
    <circle cx="59" cy="50.5" r="0.8" fill="#1a1a1a"/>
    <circle cx="60" cy="50" r="0.5" fill="#fff"/>
  </g>

  <!-- Nose -->
  <path d="M 50 51 Q 50 55 50 59" stroke="#b87850" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M 48 59 Q 49 60 50 60 Q 51 60 52 59" stroke="#b87850" stroke-width="1" fill="none"/>

  <!-- Mouth: subtle smile -->
  <path d="M 42 67 Q 50 69 58 67" stroke="#b87850" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 42 67 Q 50 68 58 67" stroke="#e8b08a" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Outline -->
  <ellipse cx="50" cy="53" rx="21" ry="26" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.5"/>
</svg>
