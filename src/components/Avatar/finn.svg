<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="fn-skin" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#eed5b2"/>
      <stop offset="65%" stop-color="#d4a870"/>
      <stop offset="100%" stop-color="#b88850"/>
    </radialGradient>
    <radialGradient id="fn-hair" cx="40%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="60%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="fn-hoodie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a7a70"/>
      <stop offset="100%" stop-color="#065a52"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#0d9488"/>

  <!-- Hoodie / clothing -->
  <path d="M0,100 Q18,76 40,70 L50,75 L60,70 Q82,76 100,100Z" fill="url(#fn-hoodie)"/>
  <!-- Hoodie kangaroo pocket hint -->
  <path d="M38,82 Q50,78 62,82 Q60,92 50,93 Q40,92 38,82Z" fill="#075c56" opacity="0.7"/>
  <!-- Round neck / hood edge -->
  <path d="M42,70 Q50,73 58,70" stroke="#075c56" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M43,67 Q50,70 57,67 L57,74 Q50,76 43,74Z" fill="#c89860"/>

  <!-- Ears -->
  <ellipse cx="30" cy="45" rx="4" ry="5" fill="#c89860"/>
  <ellipse cx="70" cy="45" rx="4" ry="5" fill="#c89860"/>

  <!-- Head -->
  <ellipse cx="50" cy="44" rx="21" ry="23" fill="url(#fn-skin)"/>

  <!-- Disheveled hair — messy, going in different directions -->
  <!-- Base dome -->
  <path d="M30,47 Q29,18 50,16 Q71,18 70,47 Q66,30 50,24 Q34,30 30,47Z"
        fill="url(#fn-hair)"/>
  <!-- Messy strand sticking up left -->
  <path d="M34,28 Q30,18 33,12 Q36,8 34,18Z" fill="#1a1a1a"/>
  <!-- Messy strand sticking up center-left -->
  <path d="M43,21 Q40,12 43,7 Q46,4 44,16Z" fill="#1a1a1a"/>
  <!-- Messy strand sticking up right -->
  <path d="M60,22 Q63,14 65,10 Q67,7 64,18Z" fill="#1a1a1a"/>
  <!-- Side piece falling over right temple -->
  <path d="M68,30 Q74,34 72,42 Q70,46 68,44" stroke="#1a1a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Bit falling over left side near ear -->
  <path d="M32,34 Q27,38 29,44" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Forelock wisp -->
  <path d="M47,22 Q44,28 46,33" stroke="#1c1c1c" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Eyebrows – slightly furrowed, intense, focused -->
  <path d="M32,35 Q37,32.5 43,34" stroke="#0d0d0d" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M57,34 Q63,32.5 68,35" stroke="#0d0d0d" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Subtle furrow between brows -->
  <path d="M46,34.5 L47.5,36.5" stroke="#0d0d0d" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M54,34.5 L52.5,36.5" stroke="#0d0d0d" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Eyes – looking slightly right (mid-thought gaze, off-camera) -->
  <ellipse cx="39" cy="41" rx="5.5" ry="4" fill="white"/>
  <ellipse cx="61" cy="41" rx="5.5" ry="4" fill="white"/>
  <!-- Upper eyelid line -->
  <path d="M33.5,39 Q39,37 44.5,39" stroke="#0d0d0d" stroke-width="1.1" fill="none"/>
  <path d="M55.5,39 Q61,37 66.5,39" stroke="#0d0d0d" stroke-width="1.1" fill="none"/>
  <!-- Iris – shifted slightly right for off-camera gaze -->
  <circle cx="40.5" cy="41" r="2.8" fill="#1e3830"/>
  <circle cx="62.5" cy="41" r="2.8" fill="#1e3830"/>
  <!-- Pupil -->
  <circle cx="40.5" cy="41" r="1.5" fill="#080808"/>
  <circle cx="62.5" cy="41" r="1.5" fill="#080808"/>
  <!-- Highlight -->
  <circle cx="41.8" cy="39.8" r="0.9" fill="white" opacity="0.9"/>
  <circle cx="63.8" cy="39.8" r="0.9" fill="white" opacity="0.9"/>

  <!-- Nose – natural, unpretentious -->
  <path d="M48,50 L47.5,54" stroke="#a07040" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M52,50 L52.5,54" stroke="#a07040" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M46.5,54 Q50,56 53.5,54" stroke="#a07040" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Subtle stubble – sparse dots/short strokes along jaw -->
  <path d="M38,61 Q41,63 44,62.5" stroke="#8a7060" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M56,62.5 Q59,63 62,61" stroke="#8a7060" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.55"/>
  <!-- Lower chin stubble area -->
  <ellipse cx="50" cy="64.5" rx="7" ry="2.5" fill="#8a7060" opacity="0.12"/>
  <!-- Individual bristle hints -->
  <path d="M44,63 L44,64.5" stroke="#7a6050" stroke-width="0.7" fill="none" opacity="0.4"/>
  <path d="M47,63.5 L47,65" stroke="#7a6050" stroke-width="0.7" fill="none" opacity="0.4"/>
  <path d="M50,64 L50,65.5" stroke="#7a6050" stroke-width="0.7" fill="none" opacity="0.4"/>
  <path d="M53,63.5 L53,65" stroke="#7a6050" stroke-width="0.7" fill="none" opacity="0.4"/>
  <path d="M56,63 L56,64.5" stroke="#7a6050" stroke-width="0.7" fill="none" opacity="0.4"/>

  <!-- Mouth – focused, slightly pressed (in-flow expression) -->
  <path d="M43.5,58.5 Q47,61 50,60.5 Q53,61 56.5,58.5" stroke="#8a4828" stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>
